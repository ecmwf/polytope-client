[project]
name = "polytope-client"
description = "A Python and command-line client to communicate with a Polytope API server."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE.txt"]
authors = [{ name = "ECMWF", email = "software.support@ecmwf.int" }]
urls = { "Homepage" = "https://github.com/ecmwf-projects/polytope-client" }
dependencies = [
  "Click",
  "requests",
  "pyyaml",
  "jsonschema",
  "docstring_parser",
  "tqdm",
  # urllib3 2.5 is the first that decodes zstd with the standard library's
  # compression.zstd (Python 3.14 and later) or with backports.zstd; earlier
  # versions look for the 'zstandard' package instead, or cannot decode zstd
  # at all. These two together give every supported interpreter a zstd
  # decoder, for results and for every other response alike.
  "urllib3>=2.5",
  "backports.zstd; python_version < \"3.14\"",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Natural Language :: English",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dynamic = ["version"]

[project.scripts]
polytope = "polytope.cli.cli:cli"

[build-system]
requires = ["setuptools", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
local_scheme = "no-local-version"

[tool.black]
line-length = 120
